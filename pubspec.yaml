name: iccasa_mobile
description: ICCASA offline-first field collection for phones and tablets.
publish_to: 'none'
version: 1.1.4+6

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  go_router: ^17.3.0
  image_picker: ^1.2.2
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.4
  signature: ^6.3.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/geography.json

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/branding/iccasa_app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/iccasa_app_icon_foreground.png
  min_sdk_android: 23
  remove_alpha_ios: true
