name: iccasa_mobile
description: ICCASA offline-first field collection for phones and tablets.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  go_router: ^17.3.0
  image_picker: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.5.4
  signature: ^6.3.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
